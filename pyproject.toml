[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "suishi-north-backtest"
version = "0.1.0"
description = "随势向北股票趋势交易系统的回测与优化系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
suishi-north-backtest = "suishi_north_backtest.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
